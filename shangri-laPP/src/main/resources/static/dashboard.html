<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLPP - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-blue-600 text-white shadow-lg">
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
            <div class="text-xl font-bold">SLPP Dashboard</div>
            <div class="flex space-x-4">
                <a href="#" class="hover:text-blue-200" id="create-petition">Create Petition</a>
                <a href="#" class="hover:text-blue-200" id="my-petitions">My Petitions</a>
                <a href="#" class="hover:text-blue-200" id="logout">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Statistics Cards -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold mb-2">My Petitions</h3>
            <p class="text-3xl font-bold" id="petition-count">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold mb-2">Total Signatures</h3>
            <p class="text-3xl font-bold" id="signature-count">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold mb-2">Active Petitions</h3>
            <p class="text-3xl font-bold" id="active-count">0</p>
        </div>
    </div>

    <!-- Create Petition Form -->
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-4">Create New Petition</h2>
        <form id="petition-form" class="space-y-4">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                <input type="text" id="title" name="title" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                       minlength="5" maxlength="200">
            </div>
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700">Content</label>
                <textarea id="content" name="content" rows="4" required
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                           maxlength="2000"></textarea>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Create Petition
            </button>
        </form>
    </div>

<!--                Submit Petition-->
<!--            </button>-->
<!--        </form>-->
<!--    </div>-->

    <!-- My Petitions List -->
    <div id="my-petitions-section" class="mt-8">
        <h2 class="text-2xl font-bold mb-6">My Petitions</h2>
        <div id="petitions-list" class="space-y-4">
            <!-- Petitions will be loaded here -->
        </div>
    </div>
</main>
<script>
    // Check authentication on page load
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('slpp_token');
        if (!token) {
            window.location.href = '/index.html';
        }
    });
</script>

<script src="js/dashboard.js"></script>
</body>
</html>
