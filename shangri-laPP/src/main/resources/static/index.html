<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shangri-La Petition Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-blue-600 text-white shadow-lg">
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
            <div class="text-xl font-bold">SLPP</div>
            <div class="hidden md:flex space-x-4" id="nav-links">
                <a href="#" class="hover:text-blue-200" id="home-link">Home</a>
                <a href="#" class="hover:text-blue-200" id="login-link">Login</a>
                <a href="#" class="hover:text-blue-200" id="register-link">Register</a>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto px-6 py-8">
    <!-- Home Section -->
    <section id="home-section" class="mb-8">
        <h1 class="text-4xl font-bold mb-6">Welcome to Shangri-La Petition Platform</h1>
        <p class="text-gray-600 mb-4">Create and sign petitions to shape parliamentary discussions in Shangri-La.</p>
        <div id="petitions-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <!-- Petitions will be loaded here -->
        </div>
    </section>

    <!-- Login Form -->
    <section id="login-section" class="hidden max-w-md mx-auto">
        <h2 class="text-2xl font-bold mb-6">Login</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2" for="login-email">Email</label>
                <input type="email" id="login-email" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="login-password">Password</label>
                <input type="password" id="login-password" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Login</button>
        </form>
    </section>

    <!-- Registration Form -->
    <section id="register-section" class="hidden max-w-md mx-auto">
        <h2 class="text-2xl font-bold mb-6">Register</h2>
        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2" for="register-email">Email</label>
                <input type="email" id="register-email" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="register-name">Full Name</label>
                <input type="text" id="register-name" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="register-dob">Date of Birth</label>
                <input type="date" id="register-dob" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="register-password">Password</label>
                <input type="password" id="register-password" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="register-bioid">Biometric ID (BioID)</label>
                <div class="flex gap-2">
                    <input type="text" id="register-bioid" class="flex-1 p-2 border rounded" required>
                    <button type="button" id="scan-qr" class="bg-gray-200 p-2 rounded hover:bg-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
                Register
            </button>
        </form>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboard-section" class="hidden">
        <h2 class="text-2xl font-bold mb-6">Your Dashboard</h2>
        <div class="grid gap-6 md:grid-cols-2">
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-xl font-semibold mb-4">Create New Petition</h3>
                <form id="petition-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2" for="petition-title">Title</label>
                        <input type="text" id="petition-title" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2" for="petition-content">Content</label>
                        <textarea id="petition-content" rows="4" class="w-full p-2 border rounded" required></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
                        Create Petition
                    </button>
                </form>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-xl font-semibold mb-4">Your Petitions</h3>
                <div id="user-petitions" class="space-y-4">
                    <!-- User's petitions will be loaded here -->
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Toast Notifications -->
<div id="toast" class="fixed bottom-4 right-4 hidden bg-white shadow-lg rounded-lg p-4"></div>

<script src="js/main.js"></script>
</body>
</html>
