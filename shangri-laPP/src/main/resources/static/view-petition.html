<!-- src/main/resources/static/view-petition.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLPP - View Petition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-blue-600 text-white shadow-lg">
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-between items-center">
            <div class="text-xl font-bold">SLPP</div>
            <div class="flex space-x-4">
                <a href="index.html" class="hover:text-blue-200">Home</a>
                <a href="dashboard.html" class="hover:text-blue-200 logged-in-only hidden">Dashboard</a>
                <a href="#" class="hover:text-blue-200" id="logout">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto px-6 py-8">
    <div class="bg-white p-6 rounded-lg shadow">
        <!-- Petition Details -->
        <div id="petition-details">
            <h1 class="text-3xl font-bold mb-4" id="petition-title"></h1>
            <div class="flex items-center text-gray-600 mb-6">
                <span class="mr-4">Created by: <span id="petition-author"></span></span>
                <span class="mr-4">Status: <span id="petition-status"></span></span>
                <span>Signatures: <span id="signature-count"></span></span>
            </div>
            <div class="prose max-w-none mb-8" id="petition-content"></div>

            <!-- Committee Response (if any) -->
            <div id="committee-response" class="hidden mt-8 p-4 bg-gray-50 rounded">
                <h3 class="text-xl font-semibold mb-4">Committee Response</h3>
                <div id="response-content"></div>
            </div>

            <!-- Sign Petition Button (for logged-in users, if petition is open) -->
            <button id="sign-petition" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 hidden">
                Sign this Petition
            </button>
        </div>

        <!-- Signatures List -->
        <div class="mt-8">
            <h3 class="text-xl font-semibold mb-4">Recent Signatures</h3>
            <div id="signatures-list" class="space-y-2">
                <!-- Signatures will be loaded here -->
            </div>
        </div>
    </div>
</main>

<script src="js/view-petition.js"></script>
</body>
</html>
