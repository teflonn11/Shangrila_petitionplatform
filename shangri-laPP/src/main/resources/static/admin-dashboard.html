<!-- src/main/resources/static/admin-dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLPP - Committee Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-blue-600 text-white shadow-lg">
  <div class="container mx-auto px-6 py-4">
    <div class="flex justify-between items-center">
      <div class="text-xl font-bold">SLPP Committee Dashboard</div>
      <div class="flex space-x-4">
        <a href="#" class="hover:text-blue-200" id="pending-petitions">Pending Petitions</a>
        <a href="#" class="hover:text-blue-200" id="threshold-settings">Threshold Settings</a>
        <a href="#" class="hover:text-blue-200" id="logout">Logout</a>
      </div>
    </div>
  </div>
</nav>

<main class="container mx-auto px-6 py-8">
  <!-- Statistics Overview -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-semibold mb-2">Total Petitions</h3>
      <p class="text-3xl font-bold" id="total-petitions">0</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-semibold mb-2">Pending Review</h3>
      <p class="text-3xl font-bold" id="pending-count">0</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-semibold mb-2">Current Threshold</h3>
      <p class="text-3xl font-bold" id="current-threshold">1000</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-semibold mb-2">Closed Petitions</h3>
      <p class="text-3xl font-bold" id="closed-count">0</p>
    </div>
  </div>

  <!-- Threshold Settings -->
  <div id="threshold-settings-section" class="bg-white p-6 rounded-lg shadow mb-8">
    <h2 class="text-2xl font-bold mb-6">Signature Threshold Settings</h2>
    <form id="threshold-form" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-2" for="signature-threshold">Signature Threshold</label>
        <input type="number" id="signature-threshold" name="threshold" min="1"
               class="w-full md:w-1/3 p-2 border rounded" required>
      </div>
      <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
        Update Threshold
      </button>
    </form>
  </div>

  <!-- Pending Petitions -->
  <div id="pending-petitions-section">
    <h2 class="text-2xl font-bold mb-6">Pending Petitions</h2>
    <div class="space-y-4" id="petitions-list">
      <!-- Petitions will be loaded here -->
    </div>
  </div>
</main>

<!-- Response Modal -->
<div id="response-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-lg w-full max-w-2xl">
    <h3 class="text-xl font-bold mb-4">Write Response</h3>
    <form id="response-form" class="space-y-4">
      <input type="hidden" id="petition-id">
      <div>
        <label class="block text-gray-700 mb-2" for="response">Committee Response</label>
        <textarea id="response" name="response" rows="6"
                  class="w-full p-2 border rounded" required></textarea>
      </div>
      <div class="flex justify-end space-x-4">
        <button type="button" class="bg-gray-300 text-gray-700 py-2 px-4 rounded hover:bg-gray-400"
                onclick="closeResponseModal()">
          Cancel
        </button>
        <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
          Submit Response
        </button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-dashboard.js"></script>
</body>
</html>
